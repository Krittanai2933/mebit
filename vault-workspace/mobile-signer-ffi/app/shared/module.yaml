product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64]

dependencies:
  - //mobileSignerFfi
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0
  - io.github.g0dkar:qrcode-kotlin:4.5.0
  - org.jetbrains.kotlinx:atomicfu:0.33.0
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose

dependencies@android:
  - $compose.uiTooling
  - $libs.androidx.activity.compose
  - $libs.androidx.camera.camera2
  - $libs.androidx.camera.lifecycle
  - $libs.androidx.camera.view
  # Android only: in dependencies it would break the iOS compilation.
  - com.google.zxing:core:3.5.3

settings:
  compose:
    enabled: true
    resources:
      packageName: com.mebit.app.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
