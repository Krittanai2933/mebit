# Source of ios-ui.xcodeproj. Regenerate with: xcodegen generate --spec project.yml
name: IosUi
options:
  bundleIdPrefix: com.mebit.verify
  deploymentTarget:
    iOS: "18.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  IosUi:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mebit.verify.ui
schemes:
  IosUi:
    build:
      targets:
        IosUi: [test]
    test:
      targets:
        - IosUi
