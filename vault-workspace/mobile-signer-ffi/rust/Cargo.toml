[package]
name = "mobile-signer-ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde_json = "1.0.151"
vault-core = { path = "../../vault-core" }
# Exact: gobley-uniffi-bindgen 0.3.7 is built on uniffi_bindgen =0.29.4, and Cargo.lock is
# git-ignored, so the pin must live here.
uniffi = { version = "=0.29.4", features = ["tokio"] }
# Same major as vault-core's bitcoin: Xpub values cross into vault-core, so both crates need one Xpub type.
bitcoin = "0.32"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
async-trait = "0.1"

# Bluetooth only where btleplug has a backend we ship. Linux would need libdbus, so it keeps
# building the default members without it; its exports answer Unsupported (src/ble.rs).
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "android"))'.dependencies]
jade-ble = { path = "../../jade-ble" }
trezor-ble = { path = "../../trezor-ble" }
btleplug = "=0.13.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
