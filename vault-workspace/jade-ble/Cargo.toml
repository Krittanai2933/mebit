[package]
name = "jade-ble"
version = "0.1.0"
edition = "2024"

[dependencies]
vault-core = { path = "../vault-core" }
bitcoin = "0.32"
btleplug = "0.11"       # the version observed working with our Jade Core; see README
tokio = { version = "1", features = ["rt", "time", "macros"] }
futures-util = "0.3"
ureq = "3.3"            # pinserver relay; rustls + bundled roots, so no platform glue on mobile
thiserror = "2"

[dev-dependencies]
# examples/jade-hw-test only — none of this reaches the library's users
bitcoin = { version = "0.32", features = ["base64"] }
bip39 = "2.2.2"
clap = { version = "4.6.4", features = ["derive"] }
miniscript = "13"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "jade-hw-test"
test = true             # the roundtrip fixture has tests of its own
